const tableBody = document.getElementById('tableBody');
const searchInput = document.getElementById('searchInput');
const counter = document.getElementById('counter');

function renderTable(filterText = "") {
 tableBody.innerHTML = "";
 let count = 0;
 
 // Sort alphabetically by Greek term
 data.sort((a, b) => a.el.localeCompare(b.el, 'el'));

 data.forEach(item => {
 const searchStr = `${item.el} ${item.en} ${item.desc}`.toLowerCase();
 if (searchStr.includes(filterText.toLowerCase())) {
 const row = `
 <tr>
 <td>
 <span class="term-el">${item.el}</span>
 <span class="term-en">${item.en}</span>
 </td>
 <td>${item.desc}</td>
 <td>
 ${item.ex}
 </td>
 </tr>
 `;
 tableBody.innerHTML += row;
 count++;
 }
 });
 counter.innerText = count;
}

searchInput.addEventListener('input', (e) => renderTable(e.target.value));

// Initial render
renderTable();
